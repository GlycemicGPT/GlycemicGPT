name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path-filter PRs so we don't spin up VMs for components that didn't
  # change. On push to main/develop the gated jobs always run -- skipping
  # is PR-only.
  #
  # Each gateable job has `needs: detect-changes` + a fail-open `if:`:
  #   if: |
  #     !cancelled()
  #     && (
  #       needs.detect-changes.result != 'success'
  #       || needs.detect-changes.outputs.<flag> == 'true'
  #       || github.event_name == 'push'
  #     )
  #
  # When the inner expression evaluates false, GitHub reports the job as
  # "skipped" and that DOES satisfy the required-status-check rule on
  # develop.
  #
  # The `!cancelled()` prefix is load-bearing. GitHub Actions implicitly
  # applies `success()` to job-level `if` conditions, which means a job
  # with `needs:` whose upstream FAILED would short-circuit the entire
  # `if` to false (regardless of what the inner expression evaluates to)
  # and report as "dependent job failed" -- a FAILURE for required-check
  # purposes. `!cancelled()` overrides the implicit `success()` so the
  # inner expression is honored even when `detect-changes` failed,
  # letting the dependent job run unconditionally and report its own
  # real result. (`!cancelled()` is preferred over `always()` because
  # we still want to skip if the workflow itself was cancelled.)
  detect-changes:
    name: Detect Component Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
      evals: ${{ steps.filter.outputs.evals }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          # Mirrors the path semantics in security-scan.yml so contributors
          # only have one mental model. Anything inside apps/api/** triggers
          # backend; anything inside apps/web/** triggers frontend; etc.
          # Tests and lockfiles are co-located under those trees so no
          # extra patterns are needed.
          #
          # Two intentional divergences from security-scan.yml: `api` and `web`
          # both also cover contracts/** and the regeneration script. They are
          # generated from the backend's Pydantic schemas, and the contract
          # drift gates that validate them -- the backend's own export gate,
          # plus the generated-TypeScript-types gate in the frontend job
          # (GLY-180) -- live in each side's own job. A PR that hand-edited
          # contracts/openapi.json, or that changed the backend surface
          # without touching apps/web/**, must not skip either gate. The
          # frontend build also typechecks apps/web/src/lib/api.ts and
          # use-glucose-stream.ts against the regenerated types, which is what
          # actually catches a contract break at a migrated call site -- the
          # drift gate alone only proves the generated file matches the spec,
          # not that consumers still compile against it.
          # security-scan.yml has no equivalent gate, so it does not need the
          # same paths.
          filters: |
            api:
              - 'apps/api/**'
              - 'contracts/**'
              - 'scripts/regen-contracts.sh'
            web:
              - 'apps/web/**'
              - 'contracts/**'
              - 'scripts/regen-contracts.sh'
            sidecar:
              - 'sidecar/**'
            evals:
              - 'evals/**'

  test-backend:
    name: Backend Tests
    needs: detect-changes
    if: |
      !cancelled()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.api == 'true'
        || github.event_name == 'push'
      )
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: glycemicgpt
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: glycemicgpt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://glycemicgpt:testpassword@localhost:5432/glycemicgpt_test
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://glycemicgpt:testpassword@localhost:5432/glycemicgpt_test
          TESTING: "true"
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcw==
        run: uv run pytest --tb=short -q

      # Story 50.S: gate the vision carb-estimate contract — including the
      # dosing-language safety scanner — in CI. These tests import the backend
      # contract via a shim, so they run with the apps/api venv.
      - name: Run vision eval-harness contract tests
        run: uv run pytest --tb=short -q ../../evals/vision_carb/tests/

      # Trust kernel regression gate (the safety of the safety net): fails the PR
      # if a production prompt / scorer / threshold / floor / dataset changes
      # without re-recording the per-surface harness version lock, and pins the
      # golden-transcript verdicts and the one-Python-brain architecture lock.
      # Run as a distinctly-named step so the gate is a first-class CI signal
      # (these also run inside the full suite above; the redundancy is cheap).
      - name: Trust kernel regression gate
        run: |
          uv run pytest --tb=short -q \
            tests/benchmarks/test_harness_version_lock.py \
            tests/benchmarks/test_golden_transcripts.py \
            tests/benchmarks/test_trust_verdict.py \
            tests/benchmarks/test_architecture_lock.py \
            ../../evals/vision_carb/tests/test_harness_version.py \
            ../../evals/vision_carb/tests/test_trust_map.py

      # Cross-repo contract discipline (GLY-92 / 56.9): fail the backend build
      # if the HTTP surface changed without regenerating the pinned OpenAPI
      # artifact that lumose-health/android-unofficial diffs against. Run as a
      # distinctly-named step so the drift gate is a first-class CI signal
      # (the same check also runs inside the pytest suite above; the redundancy
      # is cheap and mirrors the trust-kernel gate). No DB is touched -- the
      # check only imports app.openapi() -- but the env mirrors the test steps
      # so app import succeeds identically.
      - name: API contract drift gate
        env:
          TESTING: "true"
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcw==
        run: uv run python scripts/check_openapi_contract.py

      # Client-generation contract gate (GLY-179): fail the build if a Pydantic
      # schema changed without regenerating contracts/openapi.json, which is what
      # the generated TypeScript/Kotlin/Swift clients are built from. Same shape
      # and rationale as the drift gate above -- separate step so each artifact
      # reports its own signal -- but this one guards the unstamped document that
      # must stay identical to what the app serves. No DB is touched.
      - name: Exported contract drift gate
        env:
          TESTING: "true"
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcw==
        run: uv run python scripts/export_openapi.py --check

  # Report breaking OpenAPI changes against the PR's target branch (GLY-179).
  #
  # ADVISORY: this job reports, it does not block. Pre-1.0, breaking changes are
  # frequently intentional; the useful signal is "this PR breaks clients -- was
  # that on purpose?", which a human reviewer answers. Findings land as
  # annotations on the Files-changed tab and in the job summary. Tightening this
  # to a failing gate is a deliberate future step (see docs/dev/api-contracts.md),
  # mirroring the advisory-then-blocking rollout used by workflow-lint.yml.
  #
  # PR-only: a breaking-change diff needs a target branch to compare against.
  contract-breaking-changes:
    name: Contract Breaking Changes
    needs: detect-changes
    if: |
      !cancelled()
      && github.event_name == 'pull_request'
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.api == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so origin/<base_ref> exists locally. Fetching it after
          # checkout instead would need credentials we deliberately drop below.
          fetch-depth: 0
          persist-credentials: false

      - name: Read the target branch's contract
        id: base
        # BASE_REF via env, not ${{ }} interpolation into the script body, so the
        # branch name can never be substituted into the shell (zizmor template
        # injection). A missing base contract is expected exactly once -- on the
        # PR that introduces the file -- and must not fail the job.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if git show "origin/${BASE_REF}:contracts/openapi.json" > base-openapi.json 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            rm -f base-openapi.json
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No contracts/openapi.json on ${BASE_REF} yet -- nothing to compare against."
          fi

      - name: Detect breaking changes
        id: oasdiff
        if: steps.base.outputs.present == 'true'
        # Belt and braces on "advisory": whatever exit code oasdiff chooses for a
        # breaking change -- or for a spec it cannot parse -- must not turn this
        # reporting job red. The annotations and summary are the output that
        # matters; a reviewer, not this job, decides whether a break is allowed.
        continue-on-error: true
        # Accepted, known gap: the SHA pins the action, not the code it runs --
        # the action is a Docker action whose Dockerfile tracks the mutable tag
        # `tufin/oasdiff:v1.28.0`, so the executed image can change under the pin.
        # Accepted because this job runs with a read-only token and no secrets,
        # and is advisory only.
        uses: oasdiff/oasdiff-action/breaking@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0.1.12
        with:
          base: base-openapi.json
          revision: contracts/openapi.json
          # Advisory: no fail-on, so breaking changes are reported, not enforced.
          fail-on: ""
          # Do not upload our API description to oasdiff.com. The comparison runs
          # entirely in the runner; the side-by-side review link is not worth
          # shipping the health API's shape to a third party.
          review: false
          # No PR comment, so this job needs no pull-requests: write.
          github-token: ""

      - name: Summarize
        if: steps.base.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          # `outcome` is the step's real result. `conclusion` is rewritten to
          # success by continue-on-error, so branching on that would report a
          # crashed comparison as a clean bill of health.
          OASDIFF_OUTCOME: ${{ steps.oasdiff.outcome }}
          # oasdiff/oasdiff-action/breaking v0.1.12 sets `breaking` to the CLI's
          # verdict text. Deliberately not parsed: its wording is the action's to
          # change, and a summary that silently mis-classifies is worse than one
          # that quotes. It is reproduced verbatim next to the per-change
          # annotations the action emits itself, and a human reads both.
          BREAKING: ${{ steps.oasdiff.outputs.breaking }}
        run: |
          set -euo pipefail
          {
            echo "## Contract breaking changes vs \`${BASE_REF}\`"
            echo
            if [ "$OASDIFF_OUTCOME" != "success" ]; then
              echo "**The breaking-change comparison did not complete**"
              echo "(oasdiff step outcome: \`${OASDIFF_OUTCOME}\`)."
              echo "Treat this PR as **unchecked** for breaking contract changes and"
              echo "review the \`contracts/openapi.json\` diff by hand."
            else
              echo "oasdiff verdict:"
              echo
              # Indented code block rather than a fence: BREAKING is derived from
              # the PR's own spec, so on a fork PR its text is attacker-influenced
              # and a fence could be closed from inside the value, letting the rest
              # render as markdown in the job summary. Indenting every line cannot
              # be escaped that way.
              printf '%s\n' "${BREAKING:-(oasdiff produced no verdict text)}" | sed 's/^/    /'
              echo
              echo "Per-change detail, if any, appears as annotations on the Files"
              echo "changed tab."
              echo
              echo "This job is advisory: it reports, it does not block. If a break is"
              echo "intentional, bump \`apps/api/contract/CONTRACT_VERSION\` and say so"
              echo "in the PR description."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OASDIFF_OUTCOME" != "success" ]; then
            echo "::warning::The breaking-change comparison did not complete (oasdiff step outcome: ${OASDIFF_OUTCOME}); treat this PR as unchecked for breaking contract changes."
          fi

  test-frontend:
    name: Frontend Tests
    needs: detect-changes
    if: |
      !cancelled()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.web == 'true'
        || github.event_name == 'push'
      )
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Client-generation contract gate, TypeScript side (GLY-180): fail the
      # build if contracts/openapi.json changed without regenerating
      # src/generated/api-schema.ts. Node-only -- unlike the other two
      # generators in regen-contracts.sh, this one just reads the committed
      # OpenAPI document, so it doesn't need the apps/api Python toolchain
      # this job never installs. Mirrors the "Exported contract drift gate"
      # step in test-backend, which guards the document this reads.
      - name: Generated API types drift gate
        run: |
          ../../scripts/regen-contracts.sh --only web-types
          status="$(git status --porcelain -- src/generated)"
          if [[ -n "$status" ]]; then
            echo "::error::apps/web/src/generated is out of date or has untracked files. Run ./scripts/regen-contracts.sh from the repo root and commit the result."
            git diff --stat -- src/generated
            echo "$status"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify production UI variant cache safety
        run: node scripts/verify-production-ui-variant-cache.mjs

  lint-backend:
    name: Backend Lint
    needs: detect-changes
    if: |
      !cancelled()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.api == 'true'
        || github.event_name == 'push'
      )
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  eval-harness:
    name: Eval Harness
    needs: detect-changes
    # The vision-carb eval harness (evals/) re-exports the backend carb contract,
    # so an API change can break it too -- run on either. Deterministic, mocked,
    # no network / no DB: the live model run is operational and out of CI.
    if: |
      !cancelled()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.evals == 'true'
        || needs.detect-changes.outputs.api == 'true'
        || github.event_name == 'push'
      )
    runs-on: ubuntu-latest

    # Run from apps/api so the backend venv (pinned ruff/pytest) AND the backend
    # ruff config both apply to evals/ -- ruff resolves config from the working
    # directory, so linting here matches local `uv run` exactly.
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install backend dev tooling
        run: uv sync --extra dev

      - name: Run eval harness tests
        run: uv run python -m pytest ../../evals/vision_carb/tests/ -q

      - name: Run ruff check
        run: uv run ruff check ../../evals/

      - name: Run ruff format check
        run: uv run ruff format --check ../../evals/

  lint-frontend:
    name: Frontend Lint
    needs: detect-changes
    if: |
      !cancelled()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.web == 'true'
        || github.event_name == 'push'
      )
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

  test-sidecar:
    name: Sidecar Tests
    needs: detect-changes
    if: |
      !cancelled()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.sidecar == 'true'
        || github.event_name == 'push'
      )
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sidecar

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
