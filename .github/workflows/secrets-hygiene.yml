name: Secrets Hygiene Audit

# Org-wide enforcement of the two standing secret-placement invariants
# and the gated-environment drift checks. The full statement of each
# invariant lives in scripts/security/check-secret-invariants.py.
#
# No pull_request trigger, deliberately: this workflow mints an app
# token, and the bypass invariant it enforces forbids exactly that shape.
# push/schedule/dispatch run the trusted default-branch copy only.
# workflow_call carries no such guarantee on its own -- a `uses: ./...`
# reference resolves the callee at the CALLING run's own ref, so trust
# comes entirely from who can reach a call, not from this trigger
# declaration. The only in-repo caller is secrets-hygiene-promotion.yml's
# push:main trigger (lead-controlled, main is unpushable by write
# actors); SECURITY_APP_ID/_PRIVATE_KEY are not bypass credentials
# (BYPASS_REF_RE), so a same-repo write actor invoking this workflow
# from their own pull_request-triggered copy gains nothing they could
# not already reach by referencing those secrets directly.
#
# push:develop stays paths-filtered so ordinary development pushes don't
# run a full org audit. push:main is NOT triggered here: the
# ISOLATION_REVIEWERLESS_ENVS class's three legs must re-verify at every
# promotion moment, unconditional on which paths changed, so main is
# wired instead through secrets-hygiene-promotion.yml calling this
# workflow via workflow_call -- the only way to get an unconditional
# trigger on one branch and a paths-filtered one on another, since a
# single push trigger applies one paths filter across all its branches.
on:
  schedule:
    # Weekly; drift in secret placement is slow-moving but must not be
    # discovered only at the next migration.
    - cron: "17 6 * * 1"
  push:
    branches: [develop]
    paths:
      - '.github/workflows/secrets-hygiene.yml'
      - '.github/workflows/secrets-hygiene-promotion.yml'
      - 'scripts/security/check-secret-invariants.py'
  workflow_call:
    # Explicit, not `inherit`-received: the caller passes exactly the two
    # secrets this job mints a token from, nothing more.
    secrets:
      SECURITY_APP_ID:
        required: true
      SECURITY_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Secret Invariant Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        # Toolcache Python; avoids the PEP 668 externally-managed-environment
        # pip failure on ubuntu-latest (24.04+).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        # pyyaml is for check-secret-invariants.py trigger parsing.
        run: pip install pyyaml==6.0.2

      # Fail-closed proof first: every red-team fixture must still be
      # caught before the live audit's "clean" can be trusted.
      - name: Red-team self-test
        run: python3 scripts/security/check-secret-invariants.py --self-test

      # SHA-pinned because this step mints a token used to read org-wide
      # secret metadata (names/placement only, never values).
      #
      # NOTE: the glycemicgpt-security app must be granted read on
      # repo Actions, Secrets, Administration, Contents, Metadata and org
      # Secrets for the live audit to run. Listing environments needs the
      # ACTIONS permission (not Environments) -- and only on private repos,
      # which is why a partial grant passes public repos then fails closed
      # with HTTP 403 on the first private one rather than reporting a
      # hollow "clean". Org Administration (read) is additionally needed
      # for the app-installation listing: without it the WEB_MERGE
      # confinement check fails closed once WEB_MERGE material exists
      # (GLY-56.24 impl-5 cutover grants it).
      - name: Generate token for glycemicgpt-security
        id: audit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Failure surfacing: a red run on the Actions tab plus the
      # repository's scheduled-workflow failure email to maintainers.
      # If that proves too quiet in practice, wire
      # scripts/security/create-finding-issues.py in as a follow-up.
      - name: Live org audit
        env:
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
        run: python3 scripts/security/check-secret-invariants.py --live
