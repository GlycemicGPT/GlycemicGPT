name: Regenerate Gradle Lockfiles

# Renovate runs inside the renovate/renovate container (see renovate.yml),
# which has no Android SDK, so it cannot execute the AGP build to refresh the
# committed gradle.lockfile files when it bumps a Gradle dependency. With
# dependency locking enforced, a stale lockfile fails resolution on the
# Renovate PR and leaves OSV-Scanner checking outdated pins. This workflow
# closes that loop for the one Gradle project left in the repo
# (tools/medtronic-ble-spike): on Renovate Gradle PRs it regenerates the
# lockfile on a runner that has the Android SDK; the refreshed file is
# pushed back to the PR branch by the companion workflow
# regen-gradle-lockfiles-push.yml. That push retriggers this workflow once via
# `synchronize`; the second run produces no diff and uploads no artifact.
#
# Two-WORKFLOW privilege split (GLY-56.24 impl-5): this workflow executes
# PR-branch build scripts and therefore never sees a credential -- it holds
# only a read-only ambient token and mints no app token. It hands the
# refreshed lockfiles to regen-gradle-lockfiles-push.yml as an artifact. The
# push half runs on `workflow_run` (the trusted, default-branch copy) so a
# poisoned PR head cannot substitute its own steps into the job that mints the
# RENOVATE app token. RENOVATE holds NO ruleset bypass (the develop-bypass
# reuse plan was dropped; live rulesets carry only OrgAdmin + MERGE) and must
# never be granted one -- the split's security value rests on RENOVATE staying
# a plain non-bypass key. Keeping its contents:write mint out of pull_request
# context is defense-in-depth on top of that. Never add an app-token mint back
# to this workflow, and never grant the Renovate app a bypass "to match" this
# comment.
#
# See docs/dev/security-testing.md "Dependency Vulnerability Scanning" for why
# the lockfiles exist (OSV-Scanner reads only gradle.lockfile, not
# build.gradle.kts or the version catalog).

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tools/medtronic-ble-spike/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: regen-gradle-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate lockfiles (unprivileged)
    # Hard guards (mirror the push workflow's guards):
    #   1. PR author is glycemicgpt-renovate (cannot be impersonated).
    #   2. Same-repo head -- the push job pushes back to the branch, never to forks.
    #   3. Renovate branch prefix, defense in depth.
    if: |
      github.event.pull_request.user.login == 'glycemicgpt-renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      # Recorded into the artifact so the push workflow can pin its push to
      # the exact SHA these lockfiles were built from and reject the push
      # (non-fast-forward) if Renovate advanced the branch in between.
      - name: Record generated commit
        run: git rev-parse HEAD > "$RUNNER_TEMP/source-sha"

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # This job executes PR-branch build scripts; never let it write to
          # the shared Actions cache other workflows read from.
          cache-read-only: true

      # Executes build scripts from the PR branch. This job must stay
      # credential-free: no app token is ever minted here.
      - name: Regenerate lockfiles
        run: |
          (cd tools/medtronic-ble-spike && ./gradlew dependencies --write-locks --console=plain > /dev/null)

      - name: Detect lockfile changes
        id: diff
        run: |
          CHANGED=$(git status --porcelain -- '*gradle.lockfile' | wc -l)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          git status --porcelain -- '*gradle.lockfile'

      - name: Stage source-sha alongside lockfiles
        if: steps.diff.outputs.changed != '0'
        run: cp "$RUNNER_TEMP/source-sha" ./.regen-source-sha

      - name: Upload refreshed lockfiles
        if: steps.diff.outputs.changed != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-lockfiles
          # Required for .regen-source-sha: upload-artifact v4.4+ drops
          # dotfiles by default, and without the marker the push half's guard
          # always no-ops. The explicit path list bounds what this includes.
          include-hidden-files: true
          path: |
            .regen-source-sha
            tools/medtronic-ble-spike/gradle.lockfile
          if-no-files-found: error
          retention-days: 1
