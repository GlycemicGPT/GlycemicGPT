name: Workflow Lint

# Static analysis of GitHub Actions workflow files using zizmor.
# Defends against compromised/misconfigured workflows that could leak
# CI secrets (the same class of attack as the tj-actions/changed-files
# and reviewdog 2025 incidents).
#
# zizmor catches:
#   - Untrusted input flowing into shell commands (template injection)
#   - Excessive permissions: grants
#   - Dangerous pull_request_target patterns (fork code execution)
#   - Cache poisoning patterns
#   - Self-hosted runner risks
#   - Action references that evaluate at runtime
#
# ROLLOUT STATUS: ADVISORY (does not fail builds).
# zizmor surfaces findings on the existing workflow corpus that need to
# be triaged in follow-up PRs (template injection, excessive permissions,
# cache poisoning, missing persist-credentials: false). Once the baseline
# is clean, this gate will be tightened to fail on errors, then warnings,
# then registered as a required status check on develop. Tracking issue
# will be filed once this PR lands.

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow Lint Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No git-push needed -- zizmor only reads files. Disabling
          # token persistence reduces exposure when the step's external
          # tooling (pip + zizmor) runs.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install zizmor
        # pyyaml is for check-secret-invariants.py trigger parsing.
        run: pip install zizmor==1.5.2 pyyaml==6.0.2

      - name: Run zizmor (advisory)
        # ADVISORY MODE: does not fail the build. We collect findings,
        # post a summary, and upload SARIF for review. Tighten to a
        # failing gate once baseline findings are triaged.
        run: |
          set +e
          zizmor --persona=auditor --format sarif .github/workflows/ > zizmor.sarif
          ZIZMOR_EXIT=$?
          # Always also print the human-readable output so it shows in run logs
          zizmor --persona=auditor .github/workflows/ || true
          echo "::notice::zizmor exited with $ZIZMOR_EXIT (advisory mode -- not failing build)"
          # Summary counts for visibility
          if [ -s zizmor.sarif ]; then
            python3 -c "
          import json
          with open('zizmor.sarif') as f:
              data = json.load(f)
          counts = {}
          for run in data.get('runs', []):
              for r in run.get('results', []):
                  level = r.get('level', 'unknown')
                  counts[level] = counts.get(level, 0) + 1
          for level, n in sorted(counts.items()):
              print(f'::notice::zizmor {level}: {n}')
          " || true
          fi
          exit 0

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: ignore
          retention-days: 30

      # ---------------------------------------------------------------
      # Drift guard: prevent re-introduction of patterns we explicitly
      # removed for fork-PR compatibility. These are concrete bug-class
      # regressions, not advisory style issues -- this step FAILS the
      # workflow (unlike zizmor which is advisory-only).
      # ---------------------------------------------------------------
      - name: Drift guard for fork-PR compatibility
        # NOTE: this step's error messages quote the forbidden patterns
        # verbatim, which would otherwise cause a self-flagging loop.
        # We filter self-matches via a `grep -v "/$SELF:"` pipe rather
        # than relying on `--exclude` -- GNU grep's --exclude semantics
        # with --include vary by version, and the pipe is unambiguous.
        # Scans both `.yml` and `.yaml`; GitHub Actions accepts both.
        run: |
          set -e
          FAILED=0
          SELF="workflow-lint.yml"

          # 1. SECURITY_TEST_PASSWORD must not return as a repo secret.
          # The CI fixture is generated at runtime per job; reintroducing
          # the secret reference would re-break fork PRs (the secret is
          # empty on fork-triggered runs, which then 422s when smoke
          # tests try to register a user).
          HITS=$(grep -rn --include='*.yml' --include='*.yaml' \
                      -E 'secrets\.SECURITY_TEST_PASSWORD' .github/workflows/ 2>/dev/null \
                 | grep -v "/$SELF:" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Forbidden repo-secret reference detected (see above). Generate TEST_PASSWORD at job runtime instead; see security-scan.yml. Fork PRs cannot read repo secrets."
            FAILED=1
          fi

          # 2. CI_APP_ID / CI_APP_PRIVATE_KEY must never appear in workflows
          # triggered by plain pull_request: fork PRs receive empty secrets,
          # which crashes the token-generation step. The correct fix depends
          # on whether the job declares a gated environment:
          #   - Gated (environment:) jobs: reachable from push to a trusted
          #     branch ONLY. pull_request_target and workflow_run are banned
          #     outright -- they run with a trusted-branch github.ref (the
          #     PR's base and the default branch respectively), which PASSES
          #     the deployment branch policy and defeats the gate (MI-1 in
          #     scripts/security/check-secret-invariants.py).
          #   - Non-gated plain app secrets: the sanctioned shape is a
          #     workflow_run job that executes only trusted-branch code and
          #     consumes PR output via artifacts, never PR code (see
          #     regen-gradle-lockfiles-push.yml). Never pull_request_target.
          # Enforcement scope, stated plainly: the grep below catches only
          # the plain-pull_request case. The gated-environment rules are
          # enforced by the Secret-placement invariants step (MI-1); the
          # non-gated workflow_run shape is convention, reviewed not
          # machine-checked.
          #
          # Grep-based check (no YAML parser dependency). The pattern
          # `^[[:space:]]*pull_request:` matches the literal trigger key
          # and won't false-match `pull_request_target:` because the
          # latter has `_target` between `pull_request` and the colon.
          CANDIDATES=$(grep -rl --include='*.yml' --include='*.yaml' \
                            -E 'secrets\.CI_APP_(ID|PRIVATE_KEY)' .github/workflows/ 2>/dev/null \
                       | grep -v "/$SELF$" || true)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if grep -nE '^[[:space:]]*pull_request:' "$f" >/dev/null; then
              echo "::error file=$f::CI App secret reference used in a workflow triggered by pull_request. Fork PRs do not receive secrets. For a job declaring a gated environment, pull_request_target and workflow_run are banned too (both run with a trusted-branch github.ref and defeat deployment branch policies -- MI-1); gated jobs are push-to-trusted-branch only. For non-gated secrets, use a workflow_run job that executes only trusted-branch code and consumes PR output via artifacts (see regen-gradle-lockfiles-push.yml)."
              FAILED=1
            fi
          done <<< "$CANDIDATES"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Drift guard failed -- see annotations above."
            exit 1
          fi
          echo "Drift guard passed."

      # Bypass + SA invariants (GLY-56.24): no workflow referencing a
      # ruleset-bypass credential (MERGE/RELEASE app keys) or a 1Password
      # service-account token may carry a pull_request/pull_request_target
      # trigger. One implementation shared with the scheduled org-wide
      # secrets-hygiene audit -- the script parses trigger YAML (catching
      # `on: [pull_request]` and quoted/flow forms a grep would miss),
      # runs its red-team self-test first, and carries the allowlist pins
      # with their removal conditions.
      #
      # PR-time runs execute the PR's copy of this workflow and script, so
      # this gate is a tripwire for mistakes; the scheduled audit of the
      # trusted develop/main copies is the control for deliberate evasion.
      - name: Secret-placement invariants
        run: |
          python3 scripts/security/check-secret-invariants.py --self-test
          python3 scripts/security/check-secret-invariants.py \
            --repo-local .github/workflows --repo-name "${GITHUB_REPOSITORY##*/}"
