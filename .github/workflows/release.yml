name: Release

# push:main only -- no workflow_dispatch: the deployment branch policy
# binds the ref, not the actor, so a dispatch on a policy-listed branch
# would pass it. Enforced by MI-1 (scripts/security/
# check-secret-invariants.py); full rationale in
# docs/dev/gated-environments.md. Recovery for a lost gated run: re-run
# the original push run; failing that, the lead lands the next promotion
# merge on main.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # The RELEASE app key exists only as a secret in this gated
    # environment (no plain org/repo copies). Every job that mints the
    # RELEASE token declares it. The environment is reviewerless by
    # verified isolation (ISOLATION_REVIEWERLESS_ENVS in
    # check-secret-invariants.py): the key resolves only for push:main
    # runs of the workflow copy on main, which only a lead-merged
    # promotion PR can change -- re-verified on every audit.
    environment: release-gated
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Generate token for glycemicgpt-release
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  auto-merge-release:
    name: Auto-merge Release PR
    runs-on: ubuntu-latest
    # GLY-56.24 impl-5: MERGE is now a gated env secret (no plain/org
    # copy). This job mints MERGE, so it must declare the environment to
    # resolve the key; the environment is reviewerless by verified
    # isolation (see release-please above), so the run proceeds
    # unattended. It only fires on push:main after a release-please PR is
    # opened (a human-initiated promotion is present).
    environment: release-gated
    needs: release-please
    if: needs.release-please.outputs.pr != ''

    steps:
      - name: Generate token for glycemicgpt-merge
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Auto-merge release PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ needs.release-please.outputs.pr }}
        run: |
          PR_NUM=$(echo "$PR_NUMBER" | grep -oE '[0-9]+' | head -1)

          if [ -n "$PR_NUM" ]; then
            echo "Auto-merging release PR #$PR_NUM"
            gh pr merge "$PR_NUM" --squash --admin --repo ${{ github.repository }}
          else
            echo "No PR number found"
          fi

  # Detect whether the promotion contains changes to deployable code paths.
  # Doc-only promotions (README, GOVERNANCE, CODEOWNERS, docs/) should NOT
  # trigger versioned releases or container builds.
  detect-deployable-changes:
    name: Check for Deployable Changes
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created != 'true' &&
      needs.release-please.outputs.pr == '' &&
      contains(github.event.head_commit.message, 'promote develop to main')
    outputs:
      has_deployable_changes: ${{ steps.check.outputs.has_deployable_changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect deployable file changes
        id: check
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          # Compare promotion merge to its first parent (main before merge)
          CHANGED=$(git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA")
          echo "Changed files in promotion:"
          printf '%s\n' "$CHANGED"

          # Deployable paths: application code, containers
          PATTERN='^(apps/api/|apps/web/|sidecar/|docker-compose|Dockerfile)'
          MATCHED=$(printf '%s\n' "$CHANGED" | grep -E "$PATTERN" || true)

          if [ -n "$MATCHED" ]; then
            echo "has_deployable_changes=true" >> "$GITHUB_OUTPUT"
            echo "Deployable files that triggered release:"
            printf '%s\n' "$MATCHED"
          else
            echo "has_deployable_changes=false" >> "$GITHUB_OUTPUT"
            echo "No deployable changes -- skipping fallback release"
          fi

  # Fallback: when a promotion merge has no releasable conventional commits
  # (only chore/ci/docs/test) BUT contains deployable code changes,
  # release-please skips. This job creates a patch release so every
  # code-changing promotion produces versioned container images for
  # Renovate-managed k8s deployments.
  #
  # KNOWN DEFECT (2026-08-14, never yet triggered -- every recorded run
  # skipped this job): the "Commit, tag, and push" step direct-pushes to
  # main as glycemicgpt-release, which bypasses the org "Restrict main
  # merges to lead" ruleset but NOT "Protect main"'s pull_request rule,
  # so the push would be REJECTED. It fails closed: the step exits
  # nonzero, later steps skip, and no orphan tag or release is created
  # (`git tag` here is lightweight and --follow-tags only pushes
  # annotated tags, so nothing tag-shaped leaves the runner). Fix
  # tracked: rework to open a version-bump PR with the RELEASE token and
  # merge it with the MERGE token, then tag the merge commit.
  fallback-release:
    name: Fallback Patch Release
    runs-on: ubuntu-latest
    environment: release-gated
    needs: [release-please, detect-deployable-changes]
    if: >-
      needs.release-please.outputs.release_created != 'true' &&
      needs.release-please.outputs.pr == '' &&
      contains(github.event.head_commit.message, 'promote develop to main') &&
      needs.detect-deployable-changes.outputs.has_deployable_changes == 'true'
    outputs:
      release_created: ${{ steps.create-release.outputs.release_created || steps.existing-release.outputs.release_created }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Generate token for glycemicgpt-release
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "glycemicgpt-release[bot]"
          git config user.email "glycemicgpt-release[bot]@users.noreply.github.com"

      - name: Calculate next patch version
        id: bump
        run: |
          # Read from the triggering commit SHA (immutable across workflow reruns).
          # This prevents computing a different version on rerun after the first
          # run already bumped the manifest on main.
          CURRENT=$(git show ${{ github.sha }}:.release-please-manifest.json | jq -r '.["."]')
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "::error::Could not read current version from manifest"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          TAG="v${VERSION}"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          # Idempotency: if this tag already exists (workflow rerun after
          # successful first run), skip version bump but still set outputs
          # so downstream jobs can re-run against the existing release.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists (workflow rerun). Skipping version bump."
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "Fallback: bumping $CURRENT -> $VERSION (tag: $TAG)"
          fi

      - name: Update version files
        if: steps.bump.outputs.already_exists != 'true'
        env:
          CURRENT: ${{ steps.bump.outputs.current }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # 1. .release-please-manifest.json
          jq --arg v "$VERSION" '.["."] = $v' .release-please-manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json .release-please-manifest.json

          # 2. apps/api/pyproject.toml (anchored to line-start to skip dependency versions)
          sed -i "s/^version = \"${CURRENT}\"/version = \"${VERSION}\"/" apps/api/pyproject.toml

          # 3. apps/web/package.json
          jq --arg v "$VERSION" '.version = $v' apps/web/package.json > /tmp/web-pkg.json
          mv /tmp/web-pkg.json apps/web/package.json

          # 4. sidecar/package.json
          jq --arg v "$VERSION" '.version = $v' sidecar/package.json > /tmp/sidecar-pkg.json
          mv /tmp/sidecar-pkg.json sidecar/package.json

          # Verify all files were updated
          grep -q "\"${VERSION}\"" .release-please-manifest.json || { echo "::error::Manifest not updated"; exit 1; }
          grep -q "^version = \"${VERSION}\"" apps/api/pyproject.toml || { echo "::error::pyproject.toml not updated"; exit 1; }
          grep -q "\"version\": \"${VERSION}\"" apps/web/package.json || { echo "::error::web package.json not updated"; exit 1; }
          grep -q "\"version\": \"${VERSION}\"" sidecar/package.json || { echo "::error::sidecar package.json not updated"; exit 1; }

      - name: Update release-please changelog
        if: steps.bump.outputs.already_exists != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          CURRENT: ${{ steps.bump.outputs.current }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          REPO_URL="https://github.com/${{ github.repository }}"

          # Build new changelog: keep header, insert entry, append rest
          {
            head -1 .release-please-changelog.md
            echo ""
            echo "## [${VERSION}](${REPO_URL}/compare/v${CURRENT}...v${VERSION}) (${DATE})"
            echo ""
            echo ""
            echo "Maintenance release (no user-facing changes)."
            echo ""
            tail -n +2 .release-please-changelog.md
          } > /tmp/updated-rp-changelog.md
          mv /tmp/updated-rp-changelog.md .release-please-changelog.md

      - name: Commit, tag, and push
        if: steps.bump.outputs.already_exists != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag_name }}
        run: |
          git add \
            .release-please-manifest.json \
            .release-please-changelog.md \
            apps/api/pyproject.toml \
            apps/web/package.json \
            sidecar/package.json

          git commit -m "chore: release ${VERSION}"

          # Pull any intervening commits (e.g., changelog) before pushing.
          # If rebase fails (conflict), abort and fail the job.
          if ! git pull --rebase origin main; then
            echo "::error::Rebase failed -- intervening commits conflict with version bump"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi

          git tag "$TAG"
          git push origin main --follow-tags

      - name: Create GitHub Release
        id: create-release
        if: steps.bump.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag_name }}
          CURRENT: ${{ steps.bump.outputs.current }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes "Maintenance release (no user-facing changes).

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${CURRENT}...${TAG}" \
            --latest

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "Created fallback GitHub Release $TAG"

      # On rerun when release already exists, still signal success
      # so the release-body job can re-run.
      - name: Signal existing release on rerun
        id: existing-release
        if: steps.bump.outputs.already_exists == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Verify the GitHub Release (not just the tag) exists.
          # A prior run could have pushed the tag but failed before gh release create.
          if gh release view "${{ steps.bump.outputs.tag_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "Rerun: release ${{ steps.bump.outputs.tag_name }} already exists"
          else
            echo "::error::Tag exists but GitHub Release ${{ steps.bump.outputs.tag_name }} does not"
            exit 1
          fi

  update-release-body:
    name: Update Release with Contributor Credits
    runs-on: ubuntu-latest
    environment: release-gated
    needs: [release-please, fallback-release]
    if: >-
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        needs.fallback-release.outputs.release_created == 'true'
      )

    steps:
      - name: Resolve version info
        id: version-info
        run: |
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            echo "version=${{ needs.release-please.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.fallback-release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ needs.fallback-release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate token for glycemicgpt-release
        id: release-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Replace release body with contributor-credited changelog
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          TAG: ${{ steps.version-info.outputs.tag_name }}
          VERSION: ${{ steps.version-info.outputs.version }}
        run: |
          # Extract ONLY the latest dated section from CHANGELOG.md.
          #
          # CHANGELOG layout per `changelog-pr.yml`:
          #
          #   ## YYYY-MM-DD          <- latest release heading
          #   ...latest entries...
          #   <!-- changelog-cutoff:YYYY-MM-DDTHH:MM:SSZ -->
          #
          #   ## YYYY-MM-DD          <- previous release heading
          #   ...previous entries...
          #   <!-- changelog-cutoff:... -->
          #
          # The previous implementation used a `sed -n /START/,/END/` address
          # range. sed range matching is **recurring** -- once the closing
          # address matches, sed keeps scanning and re-opens a new range on
          # the next `## YYYY-MM-DD` heading. The net result was that every
          # release's body included entries going back to the beginning of
          # the changelog. Awk with an `exit` after the first range close
          # gives single-shot extraction.
          BODY=$(awk '
            /^## [0-9]{4}-[0-9]{2}-[0-9]{2}/ {
              if (in_section) exit
              in_section = 1
              next
            }
            /^<!-- changelog-cutoff:/ {
              if (in_section) exit
            }
            in_section { print }
          ' CHANGELOG.md)

          if [ -n "$BODY" ]; then
            {
              echo "## v${VERSION}"
              echo ""
              echo "$BODY"
            } > /tmp/release-body.md

            gh release edit "$TAG" --notes-file /tmp/release-body.md --repo ${{ github.repository }}
            echo "Updated $TAG release body with contributor credits"
          else
            echo "No changelog section found -- keeping release-please body"
          fi
